<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f6f5c" />
    <title>ToDo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 未ログインのとき -->
    <section id="login" hidden>
      <h1>ToDo</h1>
      <form id="login-form">
        <input
          id="password"
          type="password"
          name="password"
          placeholder="パスワード"
          autocomplete="current-password"
          required
        />
        <button type="submit">ログイン</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <!-- ログイン済みのとき -->
    <main id="app" hidden>
      <header>
        <h1>ToDo</h1>
        <button id="logout" class="link" type="button">ログアウト</button>
      </header>

      <form id="add-form">
        <input id="title" type="text" placeholder="やること" required />
        <div class="row">
          <input id="due" type="date" aria-label="期限" />
          <button type="submit">追加</button>
        </div>
      </form>

      <ul id="tasks"></ul>
      <p id="empty" class="muted" hidden>タスクはありません</p>

      <button id="toggle-done" class="link" type="button">完了したものを表示</button>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
