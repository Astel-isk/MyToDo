<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <title>ToDo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 未ログイン -->
    <section id="login" hidden>
      <div class="login-inner">
        <h1>ToDo</h1>
        <form id="login-form">
          <input
            id="password"
            type="password"
            placeholder="パスワード"
            autocomplete="current-password"
            enterkeyhint="go"
            required
          />
          <button type="submit">ログイン</button>
        </form>
        <p id="login-error" class="error" role="alert" hidden></p>
      </div>
    </section>

    <!-- ログイン済み -->
    <div id="app" hidden>
      <header>
        <div class="header-row">
          <h1>ToDo</h1>
          <nav>
            <button id="toggle-done" type="button" class="ghost" aria-pressed="false">完了分</button>
            <button id="logout" type="button" class="ghost">ログアウト</button>
          </nav>
        </div>

        <div id="filters" hidden>
          <button id="clear-filter" type="button" class="chip chip-clear" hidden>絞り込みを解除</button>
          <div id="filter-tags"></div>
        </div>
      </header>

      <main id="list" aria-live="polite"></main>

      <div id="empty" hidden>
        <p class="empty-title">タスクはありません</p>
        <p class="empty-hint">下の欄に入力して追加してください</p>
      </div>

      <form id="add-form">
        <input
          id="title"
          type="text"
          placeholder="やることを入力"
          autocomplete="off"
          enterkeyhint="done"
          required
        />
        <div class="composer-extra">
          <input
            id="tags"
            type="text"
            placeholder="タグ(空白区切り)"
            list="tag-options"
            autocomplete="off"
            enterkeyhint="done"
          />
          <datalist id="tag-options"></datalist>
          <div class="composer-row">
            <input id="due" type="date" aria-label="期限" />
            <button type="submit">追加</button>
          </div>
        </div>
      </form>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
